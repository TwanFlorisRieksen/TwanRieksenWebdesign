backend:
  name: github
  repo: TwanFlorisRieksen/TwanRieksenWebdesign
  branch: main
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
publish_mode: simple
commit_messages:
  create: 'cms: create {{collection}} “{{slug}}”'
  update: 'cms: update {{collection}} “{{slug}}”'
  delete: 'cms: delete {{collection}} “{{slug}}”'
  uploadMedia: 'cms: upload “{{path}}”'
  deleteMedia: 'cms: delete “{{path}}”'
collections:
- label: Site
  name: site
  files:
  - label: Algemeen
    name: site
    file: content/site.json
    fields:
    - label: Brand
      name: brand
      widget: object
      fields:
      - label: Naam
        name: name
        widget: string
      - label: Tagline
        name: tagline
        widget: string
      - label: Plaats (optioneel)
        name: city
        widget: string
        required: false
      - label: Logo (upload)
        name: logo
        widget: image
        required: false
    - label: SEO
      name: seo
      widget: object
      fields:
      - label: Site beschrijving
        name: site_description
        widget: text
      - label: Theme color
        name: theme_color
        widget: string
      - label: OG afbeelding (pad/url)
        name: og_image
        widget: string
        required: false
    - label: Navigatie
      name: nav
      widget: list
      summary: '{{fields.label}} → {{fields.href}}'
      fields:
      - label: Label
        name: label
        widget: string
      - label: Link
        name: href
        widget: string
      - label: Key
        name: key
        widget: string
    - label: Primary CTA
      name: cta
      widget: object
      fields:
      - label: Label
        name: primary_label
        widget: string
      - label: Link
        name: primary_href
        widget: string
    - label: Contact
      name: contact
      widget: object
      fields:
      - label: E-mail
        name: email
        widget: string
      - label: Telefoon (optioneel)
        name: phone
        widget: string
        required: false
    - label: Footer
      name: footer
      widget: object
      fields:
      - label: One-liner
        name: note
        widget: string
      - label: Copyright
        name: copyright
        widget: string
      - label: Legal links
        name: legal_links
        widget: list
        summary: '{{fields.label}}'
        fields:
        - label: Label
          name: label
          widget: string
        - label: Link
          name: href
          widget: string
    - label: GitHub fallback
      name: github_fallback
      widget: object
      fields:
      - label: Owner
        name: owner
        widget: string
      - label: Repo
        name: repo
        widget: string
      - label: Branch
        name: branch
        widget: string
        default: main
