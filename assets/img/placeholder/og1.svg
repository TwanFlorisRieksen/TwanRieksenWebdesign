<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Achtergrond -->
  <rect width="1200" height="630" rx="48" fill="url(#bg)"/>

  <!-- Logo container -->
  <rect x="80" y="140" width="240" height="240" rx="48" fill="url(#logo)"/>

  <!-- TRW in logo -->
  <g transform="translate(120 190) scale(1.1)" fill="#ffffff">
    <!-- T -->
    <path d="M0 0 H140 V30 H90 V160 H50 V30 H0 Z"/>
    <!-- R -->
    <path d="M150 0 H210
             C250 0 270 20 270 55
             C270 85 250 105 220 110
             L280 160 H235 L185 115 H150 Z
             M150 30 V90 H205
             C225 90 235 80 235 60
             C235 40 225 30 205 30 Z"/>
    <!-- W -->
    <path d="M0 160 L30 80 L60 160 L90 80 L120 160
             H150 L110 0 H90 L60 90 L30 0 H10 Z"
          fill="#e0f2fe"/>
  </g>

  <!-- Tekst -->
  <text x="380" y="260"
        font-size="64"
        font-weight="700"
        fill="#0f172a"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    Twan Rieksen Webdesign
  </text>

  <text x="380" y="330"
        font-size="36"
        fill="#2563eb"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    Professionele websites op maat
  </text>
</svg>
