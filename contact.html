<!doctype html>
<html lang="nl">
<head>
  <!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact | Twan Rieksen Webdesign</title>
  <meta name="description" content="" data-bind="contact.page.meta_description" />
  <meta name="theme-color" content="#1d4ed8" data-bind="site.seo.theme_color" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body data-page="contact" data-content="contact">
  <canvas id="network-bg" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">Naar inhoud</a>

  <header class="site-header" data-mount="site.header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand-mark">
  <img
    class="brand-logo"
    alt="Twan Rieksen Webdesign"
    width="40"
    height="40"
    loading="eager"
    decoding="async"
    hidden
  /></span>
        <span class="brand-text">
          <span class="brand-name" data-bind="site.brand.name">Twan Rieksen Webdesign</span>
          <span class="brand-tagline" data-bind="site.brand.tagline">Kant-en-klare websites voor kleine bedrijven.</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Hoofdnavigatie" data-mount="site.nav"></nav>

      <div class="header-actions">
        <button class="icon-btn search-open" type="button" aria-label="Zoeken" data-action="open-search">
          <span class="icon" aria-hidden="true">⌕</span>
        </button>
        <a class="btn primary header-cta" data-bind="site.cta.primary_label" href="contact.html">Offerte aanvragen</a>
        <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" data-action="toggle-menu">
          <span class="menu-lines" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="search-overlay" hidden data-ui="search">
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Zoeken">
      <div class="search-top">
        <div class="search-title">Zoeken</div>
        <button class="icon-btn" type="button" aria-label="Sluiten" data-action="close-search">✕</button>
      </div>
      <label class="search-field">
        <span class="sr-only">Zoekterm</span>
        <input type="search" placeholder="Zoek in pagina’s en projecten…" autocomplete="off" data-search="input" />
      </label>
      <div class="search-results" data-search="results"></div>
      <div class="search-hint">Tip: druk op <kbd>/</kbd> om te zoeken en <kbd>Esc</kbd> om te sluiten.</div>
    </div>
  </div>

  <main id="main" class="site-main">

<section class="page-hero">
  <div class="container">
    <h1 data-bind="contact.page.title"></h1>
    <p class="lead" data-bind="contact.page.subtitle"></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="grid two">
      <div class="card reveal">
        <h2 data-bind="contact.form.title"></h2>
        <p class="muted" data-bind="contact.form.hint"></p>

        <form name="offerte" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/bedankt.html" class="form">
          <input type="hidden" name="form-name" value="offerte" />

<p hidden>
  <label><input name="bot-field" /></label>
</p>

<label class="field">
            <span data-bind="contact.form.fields.name_label">Naam</span>
            <input name="naam" type="text" required />
          </label>
          <label class="field">
            <span data-bind="contact.form.fields.email_label">E-mail</span>
            <input name="email" type="email" required />
          </label>
          <label class="field">
            <span data-bind="contact.form.fields.message_label">Wensen / toelichting</span>
            <textarea name="bericht" rows="7" required></textarea>
          </label>
          <button class="btn primary full" type="submit" data-bind="contact.form.fields.submit_label">Versturen</button>
          <p class="muted small">Na verzending krijgt u een bevestiging.</p>
        </form>
      </div>

      <div class="stack">
        <div class="card reveal">
          <h3 data-bind="contact.after.title"></h3>
          <ol class="steps-list" data-mount="contact.after.steps"></ol>
          <div class="note-bar small reveal" data-bind="contact.after.note"></div>
        </div>

        <div class="card reveal">
          <div data-mount="contact.cards"></div>
        </div>
      </div>
    </div>
  </div>
</section>

  </main>

  <footer class="site-footer" data-mount="site.footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <div class="footer-brand" data-bind="site.brand.name">Twan Rieksen Webdesign</div>
        <div class="footer-note" data-bind="site.footer.note"></div>
      </div>
      <div class="footer-right">
        <div class="footer-links" data-mount="site.footer.links"></div>
        <div class="footer-copy" data-bind="site.footer.copyright"></div>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/network-bg.js"></script>
  <script src="assets/js/site.js" defer></script>

  <canvas id="network-bg" aria-hidden="true"></canvas>
</body>
</html>
